<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC-USD 価格分析チェッカー</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 20px; color: #333; }
        h1 { border-bottom: 2px solid #f2a900; padding-bottom: 8px; }
        button { background-color: #f2a900; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #d99700; }
        .card { background-color: #f8f9fa; border: 1px solid #e9ecef; border-left: 5px solid #f2a900; padding: 15px; margin-top: 20px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: right; }
        th { background-color: #f1f3f5; text-align: center; }
        td:first-child { text-align: center; }
        .plus { color: #2b8a3e; font-weight: bold; }
        .minus { color: #c92a2a; font-weight: bold; }
        .loading { margin-top: 15px; color: #666; }
    </style>
</head>
<body>

    <h1>BTC-USD 価格分析</h1>
    <p>「実行」ボタンを押すと、リアルタイム価格および過去5日間の最高値・最安値データを取得します。</p>
    <button onclick="fetchBtcData()">実行</button>

    <div id="output"></div>

    <script>
        async function fetchBtcData() {
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = '<p class="loading">データを取得・計算中...</p>';

            try {
                // 1. CoinGecko APIから過去7日分のデータ（日時・高値・安値・終値）を取得
                const response = await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=7');
                const data = await response.json();

                // 日ごとの[高値, 安値, 最新価格]を集計
                const dailyMap = {};
                
                // 価格データ: [timestamp, price]
                data.prices.forEach(([timestamp, price]) => {
                    const dateStr = new Date(timestamp).toISOString().split('T')[0];
                    if (!dailyMap[dateStr]) {
                        dailyMap[dateStr] = { high: price, low: price, current: price };
                    } else {
                        dailyMap[dateStr].high = Math.max(dailyMap[dateStr].high, price);
                        dailyMap[dateStr].low = Math.min(dailyMap[dateStr].low, price);
                        dailyMap[dateStr].current = price;
                    }
                });

                const dates = Object.keys(dailyMap).sort();
                if (dates.length < 2) {
                    outputDiv.innerHTML = '<p>データの取得に失敗しました（データ不足）。</p>';
                    return;
                }

                // 直近の日時データ抽出
                const todayStr = dates[dates.length - 1];
                const prevDateStr = dates[dates.length - 2];
                const currentPrice = dailyMap[todayStr].current;
                const prevHigh = dailyMap[prevDateStr].high;
                const prevLow = dailyMap[prevDateStr].low;

                // リアルタイム比較のパーセンテージ計算
                const currVsHighPct = ((currentPrice - prevHigh) / prevHigh) * 100;
                const currVsLowPct = ((currentPrice - prevLow) / prevLow) * 100;

                // 過去5日分の前日比計算データの作成
                const historyList = [];
                const displayDates = dates.slice(-6); // 前日比用に6日分

                for (let i = 1; i < displayDates.length; i++) {
                    const d = displayDates[i];
                    const prevD = displayDates[i - 1];

                    const high = dailyMap[d].high;
                    const prevH = dailyMap[prevD].high;
                    const highPct = ((high - prevH) / prevH) * 100;

                    const low = dailyMap[d].low;
                    const prevL = dailyMap[prevD].low;
                    const lowPct = ((low - prevL) / prevL) * 100;

                    historyList.push({
                        date: d,
                        high: high,
                        highPct: highPct,
                        low: low,
                        lowPct: lowPct
                    });
                }

                // HTML画面の生成
                const formatPct = (num) => {
                    const sign = num > 0 ? '+' : '';
                    const cssClass = num > 0 ? 'plus' : (num < 0 ? 'minus' : '');
                    return `<span class="${cssClass}">${sign}${num.toFixed(2)}%</span>`;
                };

                let html = `
                    <div class="card">
                        <p><b>現在のBTC価格:</b> $${currentPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
                        <p><b>前日高値 ($${prevHigh.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}):</b> 現在値は ${formatPct(currVsHighPct)}</p>
                        <p><b>前日安値 ($${prevLow.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}):</b> 現在値は ${formatPct(currVsLowPct)}</p>
                    </div>

                    <h3>過去5営業日の最高値・最安値（前日比）</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>日付</th>
                                <th>最高値 ($)</th>
                                <th>前日比</th>
                                <th>最安値 ($)</th>
                                <th>前日比</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                historyList.reverse().forEach(row => {
                    html += `
                        <tr>
                            <td>${row.date}</td>
                            <td>$${row.high.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                            <td>${formatPct(row.highPct)}</td>
                            <td>$${row.low.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                            <td>${formatPct(row.lowPct)}</td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;

                outputDiv.innerHTML = html;

            } catch (error) {
                console.error(error);
                outputDiv.innerHTML = '<p style="color:red;">データの取得中にエラーが発生しました。時間を置いて再度お試しください。</p>';
            }
        }
    </script>
</body>
</html>
